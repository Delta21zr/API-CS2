<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="dragonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fireBreath" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sombra exterior -->
  <ellipse cx="400" cy="225" rx="350" ry="12" fill="rgba(0,0,0,0.5)" filter="blur(6px)"/>

  <!-- Cañón Largo y Freno de Boca (Muzzle Brake) -->
  <path d="M 740 76 L 775 76 L 785 71 L 785 89 L 775 84 L 740 84 Z" fill="url(#metalDark)" stroke="#475569" stroke-width="1.5"/>
  <rect x="420" y="78" width="320" height="8" rx="2" fill="url(#dragonGold)" stroke="#b45309" stroke-width="1.5"/>
  <rect x="620" y="76" width="18" height="12" rx="2" fill="url(#metalDark)"/>

  <!-- Bípode plegado -->
  <path d="M 460 86 L 500 135 L 493 137 L 454 88 Z" fill="#334155"/>
  <path d="M 458 86 L 515 130 L 510 133 L 453 88 Z" fill="#1e293b"/>

  <!-- Mira Telescópica Alta (Scope) con montura -->
  <path d="M 230 78 L 245 44 L 270 44 L 275 78 Z" fill="url(#metalDark)"/>
  <path d="M 345 78 L 355 44 L 380 44 L 385 78 Z" fill="url(#metalDark)"/>
  <rect x="180" y="32" width="260" height="22" rx="6" fill="url(#dragonGreen)" stroke="url(#dragonGold)" stroke-width="2"/>
  <rect x="170" y="27" width="22" height="32" rx="4" fill="url(#dragonGold)"/>
  <rect x="425" y="27" width="24" height="32" rx="4" fill="url(#dragonGold)"/>
  <!-- Dial de ajuste del Scope -->
  <rect x="295" y="24" width="20" height="9" rx="2" fill="url(#dragonGold)"/>
  <!-- Lente con reflejo de francotirador -->
  <circle cx="178" cy="43" r="9" fill="#0284c7" opacity="0.85"/>
  <ellipse cx="176" cy="40" rx="4" ry="2" fill="#ffffff" opacity="0.9"/>

  <!-- Cerrojo Mecánico Metálico -->
  <path d="M 285 72 L 310 72 L 315 62 L 325 62 L 322 72 L 335 72 L 335 84 L 285 84 Z" fill="url(#metalDark)" stroke="#64748b"/>

  <!-- Cuerpo Principal (Chasis AWP Dragon Lore con cuerpo Verde y Dragón Dorado) -->
  <path d="M 210 80 L 435 80 L 425 106 L 365 106 L 350 148 L 305 148 L 315 106 L 240 106 L 195 132 L 85 138 L 50 168 L 35 162 L 55 108 L 120 86 L 210 80 Z" 
        fill="url(#dragonGreen)" stroke="url(#dragonGold)" stroke-width="2.5"/>

  <!-- Ilustración del Dragón Escupiendo Fuego (Iconografía Dragon Lore) -->
  <!-- Llamas rojas/naranjas saliendo hacia el cañón -->
  <path d="M 340 92 Q 380 84 415 88 Q 385 96 360 95 Q 395 102 410 103 Q 365 106 335 98 Z" fill="url(#fireBreath)" filter="url(#glow)"/>
  
  <!-- Cabeza y Ojo del Dragón Dorado Grabado -->
  <path d="M 280 86 Q 315 88 335 94 Q 320 98 300 96 Q 325 104 310 106 Q 285 98 275 92 Z" fill="url(#dragonGold)" stroke="#78350f" stroke-width="1"/>
  <circle cx="308" cy="91" r="2.5" fill="#ef4444" filter="url(#glow)"/>
  <!-- Nudos y filigrana celta dorada en la culata -->
  <path d="M 95 110 Q 130 95 165 112 Q 135 125 95 110 Z" fill="none" stroke="url(#dragonGold)" stroke-width="3"/>
  <path d="M 120 105 Q 145 118 175 108" fill="none" stroke="url(#dragonGold)" stroke-width="2"/>
  <circle cx="140" cy="110" r="5" fill="none" stroke="url(#dragonGold)" stroke-width="2"/>

  <!-- Cargador AWP (Magazine) -->
  <path d="M 312 108 L 348 108 L 340 152 L 306 150 Z" fill="url(#metalDark)" stroke="#475569" stroke-width="1.5"/>

  <!-- Gatillo y Guardamonte (Trigger & Guard) -->
  <path d="M 245 106 Q 235 136 270 136 Q 275 122 280 106" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 262 110 Q 254 122 258 126" fill="none" stroke="url(#dragonGold)" stroke-width="2.5"/>

  <!-- Culata y Almohadilla Ergonómica (Stock & Rubber Buttpad) -->
  <path d="M 38 165 L 48 112 L 60 110 L 48 165 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <!-- Agujero de agarre AWP Thumbhole Stock -->
  <path d="M 130 102 Q 175 100 185 120 Q 155 132 125 122 Q 115 110 130 102 Z" fill="#0b0e14" opacity="0.95"/>

  <!-- Texto distintivo sutil -->
  <text x="28" y="210" fill="#f59e0b" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="4">AWP | DRAGON LORE</text>
  <text x="635" y="210" fill="#10b981" font-family="monospace" font-weight="700" font-size="14">FACTORY NEW</text>
</svg>
