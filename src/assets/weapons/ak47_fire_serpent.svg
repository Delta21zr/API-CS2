<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 240" width="100%" height="100%">
  <defs>
    <!-- Acabado de Madera Rusa Clásica AK-47 -->
    <linearGradient id="akWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="40%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Arte Serpiente de Fuego Azteca/Maya (Verde Jade, Turquesa y Escamas) -->
    <linearGradient id="serpentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="30%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="90%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <!-- Llamas de Fuego de la Serpiente -->
    <linearGradient id="fireTeeth" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Acero Estampado AK-47 (Gunmetal) -->
    <linearGradient id="akSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="serpentGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sombra en suelo -->
  <ellipse cx="375" cy="225" rx="330" ry="10" fill="rgba(0,0,0,0.5)" filter="blur(6px)"/>

  <!-- CAÑÓN Y BOCACHA INCLINADA AK-47 (Slanted Muzzle Brake) -->
  <path d="M 685 86 L 710 86 L 718 80 L 718 96 L 710 94 L 685 94 Z" fill="url(#akSteel)" stroke="#334155" stroke-width="1.5"/>
  <rect x="520" y="87" width="168" height="6" fill="#334155"/>
  <!-- Varilla de limpieza debajo del cañón -->
  <line x1="430" y1="96" x2="685" y2="96" stroke="#475569" stroke-width="2"/>

  <!-- Punto de mira delantero (Front Sight Post) -->
  <path d="M 665 87 L 668 64 L 676 64 L 679 87 Z" fill="url(#akSteel)"/>
  <circle cx="672" cy="70" r="3" fill="#1e293b"/>

  <!-- Bloque de gases y Guarda-manos de madera (Gas Block & Handguard) -->
  <path d="M 430 84 L 525 84 L 520 74 L 435 74 Z" fill="#334155"/>
  <rect x="430" y="72" width="90" height="26" rx="4" fill="url(#akWood)" stroke="#78350f" stroke-width="1.5"/>

  <!-- CAJÓN DE MECANISMOS CENTRAL (Receiver con arte Fire Serpent) -->
  <path d="M 235 74 L 430 74 L 430 116 L 350 116 L 330 116 L 245 116 L 235 95 Z" 
        fill="url(#akSteel)" stroke="#334155" stroke-width="2"/>

  <!-- ARTE GRAFFITI: SERPIENTE DE FUEGO (Fire Serpent Art) -->
  <!-- Mandíbula con colmillos de fuego hacia el cañón -->
  <path d="M 330 80 Q 380 75 425 86 Q 395 94 370 90 Q 405 104 420 110 Q 360 114 330 100 Z" 
        fill="url(#serpentGreen)" stroke="#10b981" stroke-width="1.5" filter="url(#serpentGlow)"/>
  <!-- Colmillos y llamarada saliendo de la boca -->
  <path d="M 390 85 L 415 88 L 398 92 L 420 98 L 395 100" fill="none" stroke="url(#fireTeeth)" stroke-width="2.5" filter="url(#serpentGlow)"/>
  <!-- Ojo amenazante de la serpiente -->
  <circle cx="355" cy="88" r="3.5" fill="#facc15" filter="url(#serpentGlow)"/>
  <circle cx="356" cy="88" r="1.5" fill="#000000"/>
  <!-- Nubes de humo maya y escamas -->
  <path d="M 270 85 Q 295 80 320 86 Q 300 95 275 90 Z" fill="#047857" opacity="0.8"/>
  <path d="M 285 96 Q 315 94 335 106 Q 305 110 280 102 Z" fill="#047857" opacity="0.8"/>

  <!-- Palanca de montaje y Cerrojo (Bolt Carrier Handle) -->
  <path d="M 315 76 L 335 76 L 340 70 L 345 70 L 342 76 L 350 76 L 350 82 L 315 82 Z" fill="#94a3b8"/>

  <!-- CARGADOR CURVO TIPO PLÁTANO AK-47 (Steel Curved Banana Magazine) -->
  <path d="M 335 116 
           C 345 150, 375 190, 420 215 
           L 385 220 
           C 340 195, 310 155, 305 116 
           Z" 
        fill="url(#akSteel)" stroke="#475569" stroke-width="2"/>
  <!-- Ranuras de refuerzo en el cargador metálico -->
  <path d="M 322 135 C 335 160, 355 185, 385 200" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M 330 145 C 342 165, 360 188, 388 208" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- PISTOL GRIP DE MADERA (Pistol Grip) -->
  <path d="M 245 116 L 270 116 L 245 185 L 218 180 Z" fill="url(#akWood)" stroke="#78350f" stroke-width="2"/>
  <circle cx="235" cy="172" r="3" fill="#1e293b"/>

  <!-- Guardamonte y Gatillo -->
  <path d="M 275 116 Q 268 142 295 142 L 305 116" fill="none" stroke="#64748b" stroke-width="3"/>
  <path d="M 284 122 Q 280 134 286 135" fill="none" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- CULATA DE MADERA AK-47 (Solid Wood Buttstock) -->
  <path d="M 235 85 
           L 85 95 
           L 55 160 
           L 75 165 
           L 205 130 
           L 235 106 
           Z" 
        fill="url(#akWood)" stroke="#78350f" stroke-width="2.5"/>
  <!-- Cantonera de acero (Steel Buttplate) -->
  <path d="M 52 160 L 82 95 L 90 96 L 60 162 Z" fill="#1e293b"/>

  <!-- Textos de display -->
  <text x="35" y="45" fill="#f43f5e" font-family="sans-serif" font-weight="900" font-size="16" letter-spacing="3">AK-47 | FIRE SERPENT</text>
  <text x="35" y="66" fill="#10b981" font-family="monospace" font-weight="800" font-size="13">COLLECTION: BRAVO</text>
  <text x="580" y="45" fill="#fbbf24" font-family="monospace" font-weight="700" font-size="14">MINIMAL WEAR</text>
</svg>
