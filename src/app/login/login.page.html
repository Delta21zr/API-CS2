<ion-content class="cs2-login-bg">
  <!-- Canvas de tu animación original en Paper.js -->
  <canvas #canvasElement class="background-canvas"></canvas>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="logo-container">
      <div class="cs-logo-mock">
        <ion-icon name="locate-outline"></ion-icon>
      </div>
      <h1 class="app-title">CS2 <span class="highlight">TRACKER</span></h1>
    </div>

    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item class="cs-input">
          <ion-icon name="person-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Usuario" type="text" [(ngModel)]="loginData.username"></ion-input>
        </ion-item>

        <ion-item class="cs-input">
          <ion-icon name="lock-closed-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Contraseña" type="password" [(ngModel)]="loginData.password"></ion-input>
        </ion-item>

        <ion-button expand="block" class="cs-button-t" routerLink="/tabs/tab1" routerDirection="root">
          <ion-icon name="skull-outline" slot="start"></ion-icon>
          Entrar como T
        </ion-button>
        
        <ion-button expand="block" class="cs-button-ct" fill="outline" routerLink="/tabs/tab1" routerDirection="root">
          <ion-icon name="shield-half-outline" slot="start"></ion-icon>
          Entrar como CT
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
