<ion-content class="cs2-login-bg">
  <!-- Canvas de tu animación original en Paper.js -->
  <canvas #canvasElement class="background-canvas"></canvas>
  <div class="overlay"></div>

  <div class="login-container">
    <div class="logo-container">
      <div class="cs-logo-mock">
        <ion-icon name="locate-outline"></ion-icon>
      </div>
      <h1 class="app-title">CS2 <span class="highlight">TRACKER</span></h1>
    </div>

    <ion-card class="login-card" [style.marginTop]="topLayerMargin === '100%' ? '-200%' : '0'" style="transition: margin-top 0.5s ease-in-out;">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item class="cs-input">
          <ion-icon name="person-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Usuario" type="text" [(ngModel)]="loginData.username"></ion-input>
        </ion-item>

        <ion-item class="cs-input">
          <ion-icon name="lock-closed-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Contraseña" type="password" [(ngModel)]="loginData.password"></ion-input>
        </ion-item>

        <ion-button expand="block" class="cs-button-t" (click)="onLogin()">
          <ion-icon name="skull-outline" slot="start"></ion-icon>
          Iniciar Sesión
        </ion-button>
        
        <ion-button expand="block" class="cs-button-ct" fill="outline" (click)="goToSignup()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Crear una cuenta nueva
        </ion-button>
      </ion-card-content>
    </ion-card>

    <ion-card class="login-card signup-card" [style.marginTop]="topLayerMargin === '100%' ? '0' : '200%'" style="transition: margin-top 0.5s ease-in-out; position: absolute; top: 150px; width: 90%; max-width: 400px; left: 50%; transform: translateX(-50%);">
      <ion-card-header>
        <ion-card-title class="ion-text-center">Crear Cuenta</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-item class="cs-input">
          <ion-icon name="person-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Usuario" type="text" [(ngModel)]="signupData.username"></ion-input>
        </ion-item>

        <ion-item class="cs-input">
          <ion-icon name="locate-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Correo" type="email" [(ngModel)]="signupData.email"></ion-input>
        </ion-item>

        <ion-item class="cs-input">
          <ion-icon name="lock-closed-outline" slot="start" color="warning"></ion-icon>
          <ion-input placeholder="Contraseña" type="password" [(ngModel)]="signupData.password"></ion-input>
        </ion-item>

        <ion-button expand="block" class="cs-button-t" (click)="onSignup()">
          <ion-icon name="person-add-outline" slot="start"></ion-icon>
          Registrarme
        </ion-button>
        
        <ion-button expand="block" class="cs-button-ct" fill="outline" (click)="goToLogin()">
          Volver al Login
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
