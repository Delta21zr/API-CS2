<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>
      Mi Portafolio CS2
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cs2-bg">
  <ion-header collapse="condense">
    <ion-toolbar color="dark">
      <ion-title size="large">Portafolio</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="stats-container">
    <ion-card class="stats-card ct-border">
      <ion-card-header>
        <ion-card-subtitle>Valor Total</ion-card-subtitle>
        <ion-card-title>$1,245.50</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <span class="profit positive"><ion-icon name="caret-up"></ion-icon> $45.20 (+3.7%)</span>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-list class="inventory-list">
    <ion-list-header>
      <ion-label>Skins Recientes</ion-label>
    </ion-list-header>

    <!-- Item de Ejemplo: AK-47 -->
    <ion-item class="cs-item item-covert">
      <ion-thumbnail slot="start">
        <img src="https://img.icons8.com/color/96/assault-rifle.png" alt="AK-47 Redline" />
      </ion-thumbnail>
      <ion-label>
        <h2>AK-47 | Redline</h2>
        <p>Field-Tested</p>
      </ion-label>
      <div class="price-info" slot="end">
        <h3 class="current-price">$22.50</h3>
        <span class="buy-price">Comprado: $18.00</span>
      </div>
    </ion-item>

    <!-- Item de Ejemplo: M4A1-S -->
    <ion-item class="cs-item item-restricted">
      <ion-thumbnail slot="start">
        <img src="https://img.icons8.com/color/96/gun.png" alt="M4A1-S Decimator" />
      </ion-thumbnail>
      <ion-label>
        <h2>M4A1-S | Decimator</h2>
        <p>Minimal Wear</p>
      </ion-label>
      <div class="price-info" slot="end">
        <h3 class="current-price">$15.30</h3>
        <span class="buy-price">Comprado: $16.00</span>
      </div>
    </ion-item>

  </ion-list>
</ion-content>
