<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-title>Catálogo CS2</ion-title>
  </ion-toolbar>
  <ion-toolbar color="dark">
    <ion-searchbar (ionInput)="filterItems($event)" placeholder="Buscar por arma o colección..."></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="cs2-bg">
  <ion-header collapse="condense">
    <ion-toolbar color="dark">
      <ion-title size="large">Catálogo CS2</ion-title>
    </ion-toolbar>
  </ion-header>

  <div *ngIf="filteredItems.length === 0" class="ion-text-center ion-padding" style="color: white;">
    <p>No se encontraron armas que coincidan con la búsqueda.</p>
  </div>

  <ion-grid>
    <ion-row>
      <!-- Mostrar las armas en tarjetas tipo grilla -->
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let item of filteredItems">
        <ion-card class="cs-item-card">
          <ion-card-header class="ion-text-center">
            <img [src]="item.image_url" alt="{{ item.name }}" style="max-height: 120px; object-fit: contain; margin: 0 auto; display: block;" />
            <ion-card-title style="font-size: 1.1rem; margin-top: 10px;">{{ item.name }}</ion-card-title>
            <ion-card-subtitle>{{ item.collection_name }}</ion-card-subtitle>
          </ion-card-header>
          
          <ion-card-content>
            <ion-item lines="none" class="ion-no-padding">
              <ion-badge [color]="getRarityColor(item.rarity)" slot="start">
                {{ item.rarity || 'Normal' }}
              </ion-badge>
              <div slot="end" class="ion-text-right">
                <h3 style="color: #4CAF50; font-weight: bold; margin: 0;">${{ item.current_price }}</h3>
                <small style="color: #aaa;">{{ item.exterior }}</small>
              </div>
            </ion-item>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
